<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Signika&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - CORE Multistore</title>
    <style>
        .card {
            border-radius: 20px;
            border: none;
        }
        .btn-primary {
            background-color: #667eea;
            border: none;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background-color: #5a67d8;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background-color: #718096;
            border: none;
        }
        .btn-secondary:hover {
            background-color: #4a5568;
        }
    </style>
</head>
<body>
    <div class="d-flex vh-100 w-100 p-4 align-items-center justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <img src="../img/logocore2.png" alt="Logo CORE" style="width: 120px; height: auto;">
                        <h2 class="mt-3 fw-bold">Recuperar contraseña</h2>
                        <p class="text-muted">Ingresa tu correo electrónico y te enviaremos una nueva contraseña</p>
                    </div>

                    <form id="formRecuperar">
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Correo electrónico</label>
                            <input type="email" class="form-control form-control-lg" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            Enviar nueva contraseña
                        </button>

                        <a href="../index.php" class="btn btn-secondary w-100">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2">
                                <path d="M19 12H5M12 19l-7-7 7-7"></path>
                            </svg>
                            Volver al inicio
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        $('#formRecuperar').submit(function(e) {
            e.preventDefault();
            
            const correo = $('#correo').val();
            
            $.ajax({
                url: '../validations/recuperar_password.php',
                type: 'POST',
                data: { correo: correo },
                dataType: 'json',
                success: function(resp) {
                    if (resp.ok) {
                        Swal.fire({
                            icon: 'success',
                            title: '¡Correo enviado!',
                            html: resp.msg,
                            confirmButtonColor: '#667eea'
                        }).then(() => {
                            window.location.href = '../index.php';
                        });
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            html: resp.msg,
                            confirmButtonColor: '#667eea'
                        });
                    }
                },
                error: function() {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        html: 'Hubo un problema al procesar tu solicitud',
                        confirmButtonColor: '#667eea'
                    });
                }
            });
        });
    </script>
</body>
</html>
